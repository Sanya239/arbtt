name: Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GHC_VERSION: 9.6.7

jobs:
  build-windows-installer:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        id: haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: latest

      - name: Set up the PCRE native dependency
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-pcre
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Cache Cabal packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: windows-cabal-${{ env.GHC_VERSION }}-${{ hashFiles('arbtt.cabal') }}
          restore-keys: |
            windows-cabal-${{ env.GHC_VERSION }}-

      - name: Build and test
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrtRoot = Join-Path $env:MSYS2_ROOT 'ucrt64'
          $env:PATH = "$env:PATH;$(Join-Path $ucrtRoot 'bin')"
          $env:PKG_CONFIG_PATH = Join-Path $ucrtRoot 'lib\pkgconfig'
          $env:TZDIR = Join-Path $env:MSYS2_ROOT 'usr\share\zoneinfo'
          $pcreImportLibrary = Join-Path $ucrtRoot 'lib\libpcre.dll.a'
          if (-not (Test-Path $pcreImportLibrary)) {
            throw "PCRE import library was not found at $pcreImportLibrary"
          }
          if (-not (Test-Path (Join-Path $env:TZDIR 'UTC'))) {
            throw "The UTC timezone file was not found below $env:TZDIR"
          }
          pkg-config --modversion libpcre
          if ($LASTEXITCODE -ne 0) { throw 'pkg-config could not find libpcre.' }

          $cabalIncludeDir = (Join-Path $ucrtRoot 'include').Replace('\', '/')
          $cabalLibDir = (Join-Path $ucrtRoot 'lib').Replace('\', '/')
          $nativeOptions = @(
            "--extra-include-dirs=$cabalIncludeDir",
            "--extra-lib-dirs=$cabalLibDir",
            '--constraint=pcre-light +use-pkg-config'
          )
          cabal build all --enable-tests @nativeOptions
          cabal test all --enable-tests --test-show-details=direct @nativeOptions

      - name: Build installer
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrtRoot = Join-Path $env:MSYS2_ROOT 'ucrt64'
          $env:PATH = "$env:PATH;$(Join-Path $ucrtRoot 'bin')"
          $env:PKG_CONFIG_PATH = Join-Path $ucrtRoot 'lib\pkgconfig'
          $pcreDll = Join-Path $ucrtRoot 'bin\libpcre-1.dll'
          .\scripts\build-windows-installer.ps1 `
            -PcreDll $pcreDll `
            -TimeZoneDir (Join-Path $env:MSYS2_ROOT 'usr\share\zoneinfo') `
            -CabalExtraIncludeDir (Join-Path $ucrtRoot 'include') `
            -CabalExtraLibDir (Join-Path $ucrtRoot 'lib') `
            -CabalConstraint 'pcre-light +use-pkg-config'

      - name: Smoke-test installed programs
        shell: pwsh
        run: |
          $version = (Select-String -Path arbtt.cabal -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $installer = (Resolve-Path "dist\installer\arbtt-setup-$version-windows-x86_64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'arbtt-install-test'
          $installerProcess = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=modifypath', "/DIR=$installDir") `
            -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "Installer exited with $($installerProcess.ExitCode)"
          }

          $installedBin = Join-Path $installDir 'bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $installedBin) {
            throw 'Installer did not add its bin directory to the user PATH.'
          }

          @('arbtt-capture', 'arbtt-stats', 'arbtt-dump', 'arbtt-import', 'arbtt-recover') |
            ForEach-Object {
              $program = Join-Path $installDir "bin\$_.exe"
              $programProcess = Start-Process -FilePath $program -ArgumentList '--version' -Wait -PassThru
              if ($programProcess.ExitCode -ne 0) {
                throw "$_ --version exited with $($programProcess.ExitCode)"
              }
            }

          Remove-Item Env:TZ -ErrorAction SilentlyContinue
          Remove-Item Env:TZDIR -ErrorAction SilentlyContinue
          $testLog = (Resolve-Path 'tests\small.log').Path
          $testConfig = (Resolve-Path 'tests\small.cfg').Path

          $captureOutput = Join-Path $env:RUNNER_TEMP 'arbtt-capture-output.txt'
          $captureError = Join-Path $env:RUNNER_TEMP 'arbtt-capture-error.txt'
          $captureProcess = Start-Process -FilePath (Join-Path $installedBin 'arbtt-capture.exe') `
            -ArgumentList '--dump' `
            -RedirectStandardOutput $captureOutput -RedirectStandardError $captureError `
            -Wait -PassThru
          if ($captureProcess.ExitCode -ne 0) {
            $errorText = Get-Content -Raw $captureError
            throw "Installed arbtt-capture --dump failed with $($captureProcess.ExitCode): $errorText"
          }
          if (-not (Test-Path $captureOutput) -or (Get-Item $captureOutput).Length -eq 0) {
            throw 'Installed arbtt-capture --dump did not produce output.'
          }
          $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
          $captureText = [System.IO.File]::ReadAllText($captureOutput, $strictUtf8)
          if ($captureText -match '\\Device\\HarddiskVolume') {
            throw 'Installed arbtt-capture still reports full NT process paths.'
          }

          $statsOutput = Join-Path $env:RUNNER_TEMP 'arbtt-stats-output.txt'
          $statsError = Join-Path $env:RUNNER_TEMP 'arbtt-stats-error.txt'
          $statsProcess = Start-Process -FilePath (Join-Path $installedBin 'arbtt-stats.exe') `
            -ArgumentList @('--logfile', $testLog, '--categorizefile', $testConfig, '--total-time') `
            -RedirectStandardOutput $statsOutput -RedirectStandardError $statsError `
            -Wait -PassThru
          if ($statsProcess.ExitCode -ne 0) {
            $errorText = Get-Content -Raw $statsError
            throw "Installed arbtt-stats failed with $($statsProcess.ExitCode): $errorText"
          }
          if ((Get-Content -Raw $statsOutput) -notmatch 'Total time per tag') {
            throw 'Installed arbtt-stats did not produce the expected report.'
          }

          $dumpOutput = Join-Path $env:RUNNER_TEMP 'arbtt-dump-output.txt'
          $dumpError = Join-Path $env:RUNNER_TEMP 'arbtt-dump-error.txt'
          $unicodeLog = (Resolve-Path 'tests\unicode.log').Path
          $dumpProcess = Start-Process -FilePath (Join-Path $installedBin 'arbtt-dump.exe') `
            -ArgumentList @('--logfile', $unicodeLog, '--last', '1') `
            -RedirectStandardOutput $dumpOutput -RedirectStandardError $dumpError `
            -Wait -PassThru
          if ($dumpProcess.ExitCode -ne 0) {
            $errorText = Get-Content -Raw $dumpError
            throw "Installed arbtt-dump failed with $($dumpProcess.ExitCode): $errorText"
          }
          if (-not (Test-Path $dumpOutput) -or (Get-Item $dumpOutput).Length -eq 0) {
            throw 'Installed arbtt-dump did not produce output.'
          }
          $dumpText = [System.IO.File]::ReadAllText($dumpOutput, $strictUtf8)
          if (-not $dumpText.Contains('aäα')) {
            throw 'Installed arbtt-dump did not produce the expected Unicode title.'
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstallerProcess = Start-Process -FilePath $uninstaller `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait -PassThru
          if ($uninstallerProcess.ExitCode -ne 0) {
            throw "Uninstaller exited with $($uninstallerProcess.ExitCode)"
          }

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $installedBin) {
            throw 'Uninstaller did not remove its bin directory from the user PATH.'
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: arbtt-windows-x86_64
          path: dist/installer/*.exe
          if-no-files-found: error
